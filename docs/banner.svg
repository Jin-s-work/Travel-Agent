<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Travel Inbox RAG - 여행 예약 확인 메일을 구조화해 일정으로 정리하고, 질문에 근거 문서와 함께 답하는 RAG 어시스턴트">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="55%" stop-color="#5B4BE0"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cardEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>

    <clipPath id="round">
      <rect width="1200" height="340" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#glow)"/>

    <!-- 흩어진 예약 메일을 상징하는 카드들 -->
    <g opacity="0.55">
      <g transform="translate(910 66) rotate(-9)">
        <rect width="176" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.13" stroke="url(#cardEdge)"/>
        <rect x="18" y="21" width="52" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/>
        <rect x="18" y="38" width="106" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.28"/>
      </g>
      <g transform="translate(946 148) rotate(4)">
        <rect width="176" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.13" stroke="url(#cardEdge)"/>
        <rect x="18" y="21" width="66" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/>
        <rect x="18" y="38" width="92" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.28"/>
      </g>
      <g transform="translate(898 232) rotate(-5)">
        <rect width="176" height="66" rx="12" fill="#FFFFFF" fill-opacity="0.13" stroke="url(#cardEdge)"/>
        <rect x="18" y="21" width="44" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.55"/>
        <rect x="18" y="38" width="116" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.28"/>
      </g>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', Helvetica, Arial, sans-serif">
      <text x="80" y="146" fill="#FFFFFF" font-size="62" font-weight="700" letter-spacing="-1.6">Travel Inbox RAG</text>

      <text x="82" y="196" fill="#FFFFFF" fill-opacity="0.82" font-size="21" font-weight="400" letter-spacing="-0.2">여행 예약 확인 메일을 구조화해 일정으로 정리하고,</text>
      <text x="82" y="226" fill="#FFFFFF" fill-opacity="0.82" font-size="21" font-weight="400" letter-spacing="-0.2">질문에 근거 문서와 함께 답하는 RAG 어시스턴트</text>

      <g font-size="14" font-weight="600" letter-spacing="0.2">
        <g transform="translate(82 262)">
          <rect width="72" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.16"/>
          <text x="36" y="20" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle">항공</text>
        </g>
        <g transform="translate(164 262)">
          <rect width="72" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.16"/>
          <text x="36" y="20" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle">숙소</text>
        </g>
        <g transform="translate(246 262)">
          <rect width="84" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.16"/>
          <text x="42" y="20" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle">렌터카</text>
        </g>
        <g transform="translate(340 262)">
          <rect width="72" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.16"/>
          <text x="36" y="20" fill="#FFFFFF" fill-opacity="0.92" text-anchor="middle">투어</text>
        </g>
      </g>
    </g>
  </g>
</svg>
