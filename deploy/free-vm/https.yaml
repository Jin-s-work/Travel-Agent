# Optional public HTTPS proxy; run together with compose.yaml on the VM.
services:
  https:
    image: caddy@sha256:1a81ac3d1a49b2b385a5bfafb8bd39fb40fa1d717461d825ee0d65df91a6e97b
    restart: unless-stopped
    user: "1000:1000"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set your actual DNS hostname}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${HOST_TLS_DIR:?Set a persistent TLS directory}/data
        target: /data
        bind: {create_host_path: false}
      - type: bind
        source: ${HOST_TLS_DIR:?Set a persistent TLS directory}/config
        target: /config
        bind: {create_host_path: false}
    read_only: true
    tmpfs: [/tmp:rw,noexec,nosuid,size=16777216,mode=1777]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
